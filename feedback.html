<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - The Lecture Ledger</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">The Lecture Ledger</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="tracker.html">Subject Tracker</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </header>
  <main>
    <h1>Feedback</h1>
    <section class="box">
      <form id="feedbackForm" onsubmit="return false;">
        <label for="fname">Name</label>
        <input type="text" id="fname">
        <label for="femail">Email</label>
        <input type="text" id="femail">
        <label for="frating">Rating</label>
        <select id="frating">
          <option value="">Choose rating</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Average</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Very poor</option>
        </select>
        <label for="fmessage">Message</label>
        <textarea id="fmessage" rows="4"></textarea>
        <button type="button" onclick="submitFeedback()">Send feedback</button>
      </form>
      <div id="feedbackResult"></div>
    </section>
  </main>
  <footer>The Lecture Ledger - Web Development Mini-Project, Bennett University</footer>
  <script src="js/script.js"></script>
</body>
</html>
